name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run test suite
        run: node tests/test-projects.js
      - name: Run publish gate tests
        run: node tests/test-publish-gate.js
      - name: Run project checker tier tests
        run: python3 tests/test_check_projects.py
